<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synchronized Arena - Match</title>
    <link rel="stylesheet" href="style.css">
    <style>
                /* --- TOP BAR STYLES --- */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.3); /* Semi-transparent dark background */
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .top-bar .user-info {
            font-size: 16px;
            font-weight: bold;
        }

        .top-bar .user-stats {
            font-size: 16px;
            background: #FFD700; /* Gold pill for Elo */
            color: #333;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 5px;
            margin: 20px auto;
            width: max-content;
            background: #333;
            padding: 5px;
            border-radius: 8px;
        }
        .cell {
            width: 100px;
            height: 100px;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3em;
            font-weight: bold;
            cursor: pointer;
            color: #2a5298;
        }
        .cell:hover { background: #f0f0f0; }
        #status-text { font-size: 1.2em; font-weight: bold; margin-bottom: 15px; }
    </style>
</head>
<body>
<!-- /*TOP USER BAR*/ -->
<div class="top-bar">
    <div class="user-info">
        <span>👤 <span id="topbar-name">Loading...</span></span>
    </div>
    <div class="user-stats">
        <span>🏆 Elo: <strong id="topbar-elo">---</strong></span>
    </div>
</div>
<div class="container">
    <h2>Tic-Tac-Toe</h2>
    <div id="status-text">Loading game state...</div>
    
    <div class="board" id="board">
        </div>
</div>

<script src="arena.js"></script>
</body>
</html>
