<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Leaderboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* --- TOP BAR STYLES --- */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.3); /* Semi-transparent dark background */
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .top-bar .user-info {
            font-size: 16px;
            font-weight: bold;
        }

        .top-bar .user-stats {
            font-size: 16px;
            background: #FFD700; /* Gold pill for Elo */
            color: #333;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
        }
        .leaderboard-container {
            width: 650px;
            max-width: 95%;
            /* Add these two lines: */
            max-height: 90vh;  
            overflow-y: auto;  
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 15px;
        }

        thead {
            background: #2a5298;
            color: white;
        }

        thead th {
            padding: 12px 15px;
            text-align: left;
        }

        tbody tr {
            border-bottom: 1px solid #ddd;
            transition: background 0.2s;
        }

        tbody tr:hover {
            background: #f0f4ff;
        }

        tbody td {
            padding: 11px 15px;
            color: #333;
        }

        /* Rank column */
        td.rank {
            font-weight: bold;
            color: #2a5298;
            text-align: center;
        }

        /* Gold / Silver / Bronze for top 3 */
        tr:nth-child(1) td.rank { color: #FFD700; font-size: 1.2em; }
        tr:nth-child(2) td.rank { color: #C0C0C0; font-size: 1.1em; }
        tr:nth-child(3) td.rank { color: #CD7F32; }

        .online-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #28a745;
            margin-right: 6px;
        }

        .offline-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ccc;
            margin-right: 6px;
        }

        .back-btn {
            margin-top: 20px;
            width: auto;
            padding: 10px 25px;
            font-size: 14px;
        }

        #loading-msg {
            color: #666;
            margin-top: 20px;
        }
    </style>
</head>
<body>
<!-- TOP USER BAR -->
<div class="top-bar">
    <div class="user-info">
        <span>👤 <span id="topbar-name">Loading...</span></span>
    </div>
    <div class="user-stats">
        <span>🏆 Elo: <strong id="topbar-elo">---</strong></span>
    </div>
</div>
<div class="container leaderboard-container">
    <h2>🏆 Global Leaderboard</h2>
    <p>All players ranked by Elo rating.</p>

    <p id="loading-msg">Loading leaderboard...</p>

    <table id="leaderboard-table" style="display:none;">
        <thead>
            <tr>
                <th>#</th>
                <th>Player</th>
                <th>UID</th>
                <th>Elo Rating</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="leaderboard-body">
        </tbody>
    </table>

    <button class="back-btn" onclick="window.location.href='lobby.html'">← Back to Lobby</button>
</div>
<div id="challenge-modal" style="display: none; position: fixed; top: 30%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 1000; text-align: center;">
    <h3 id="challenge-text">⚔️ Challenge Incoming!</h3>
    <button id="accept-btn" style="background: #28a745; margin: 10px; width: 100px; color: white; border:none; padding:10px; border-radius:5px; cursor:pointer;">Accept</button>
    <button id="decline-btn" style="background: #d9534f; margin: 10px; width: 100px; color: white; border:none; padding:10px; border-radius:5px; cursor:pointer;">Decline</button>
</div>

<script src="leaderboard.js"></script>
</body>
</html>
